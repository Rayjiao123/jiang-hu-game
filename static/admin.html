<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Jianghu Admin</title>
<style>
  :root { color-scheme: dark; --ink: #13120f; --ink-2: #1c1a16; --line: #3b362c; --text: #ece6d8; --dim: #a39b88; --cinnabar: #c8402f; --jade: #6fae93; --gold: #d9b45a; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--ink); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px 64px; }
  main { max-width: 1100px; margin-inline: auto; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: 22px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input, button { font: inherit; color: inherit; }
  input { background: var(--ink-2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
  button { background: var(--ink-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.danger { border-color: var(--cinnabar); color: #f0a196; }
  button.primary { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; }
  .filters button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .muted { color: var(--dim); font-size: 13px; }
  .err { color: #f0a196; }
  .list { display: grid; gap: 12px; }
  .row { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 14px; align-items: start; background: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  .row.hidden { border-color: var(--cinnabar); }
  .row img, .row .ph { width: 72px; height: 90px; object-fit: cover; border-radius: 4px; background: #ebe1c8; display: block; }
  .row h2 { margin: 0; font-size: 17px; }
  .row h2 small { color: var(--dim); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--jade); color: var(--jade); margin-right: 6px; }
  .pill.off { border-color: var(--cinnabar); color: #f0a196; }
  details { margin-top: 6px; font-size: 13.5px; color: var(--dim); }
  details p { margin: 4px 0; overflow-wrap: anywhere; }
  details b { color: var(--text); font-weight: 600; }
  .actions { display: grid; gap: 6px; justify-items: stretch; }
  @media (max-width: 640px) { .row { grid-template-columns: 56px minmax(0, 1fr); } .row img, .row .ph { width: 56px; height: 70px; } .actions { grid-column: 1 / -1; grid-auto-flow: column; } }
</style>
</head>
<body>
<main>
  <div class="bar"><h1>江湖录 admin</h1><span class="muted" id="count"></span></div>

  <form class="bar" id="login">
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="primary" type="submit">Sign in</button>
    <span class="err" id="loginErr"></span>
  </form>

  <section id="panel" hidden>
    <div class="bar" style="justify-content:space-between;margin-bottom:12px">
      <div class="bar filters" id="filters">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="review">Needs review</button>
        <button type="button" data-f="hidden">Hidden</button>
        <button type="button" data-f="live">Live</button>
      </div>
      <div class="bar">
        <button type="button" id="seed" title="Rolls and releases new characters signed Ray (takes about 10 seconds each)">Add 3 citizens</button>
        <button type="button" id="refresh">Refresh</button>
        <button type="button" id="export">Download backup (JSON)</button>
        <button type="button" id="signout">Sign out</button>
      </div>
    </div>
    <p class="err" id="err" hidden></p>
    <div class="list" id="list"></div>
  </section>
</main>
<script src="/portrait.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const flat = v => String(v ?? "").split("|||").map(x => x.trim()).join(" / ");   // "English ||| 中文" shown as "English / 中文"
  let pw = "", npcs = [], filter = "all", confirmDelete = null;
  try { pw = sessionStorage.getItem("jianghu-admin") || ""; } catch {}

  async function call(method, path, body) {
    const r = await fetch(path, { method, headers: { authorization: "Bearer " + pw, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(data.detail || "Request failed."), { status: r.status });
    return data;
  }

  async function load() {
    try {
      npcs = (await call("GET", "/api/admin/npcs")).npcs;
      $("#login").hidden = true; $("#panel").hidden = false; $("#err").hidden = true;
      render();
    } catch (e) {
      $("#login").hidden = false; $("#panel").hidden = true;
      $("#loginErr").textContent = pw ? e.message : "";
    }
  }

  function render() {
    const shown = npcs.filter(n => filter === "all" || (filter === "live" && !n.hidden) || (filter === "hidden" && n.hidden) || (filter === "review" && n.hidden && n.flag));
    const review = npcs.filter(n => n.hidden && n.flag).length;
    $("#count").textContent = `${npcs.length} NPCs · ${npcs.filter(n => !n.hidden).length} live · ${review} need review`;
    const list = $("#list"); list.textContent = "";
    if (!shown.length) { const p = document.createElement("p"); p.className = "muted"; p.textContent = "Nothing here."; list.append(p); }
    shown.forEach(n => {
      const row = document.createElement("article"); row.className = "row" + (n.hidden ? " hidden" : "");
      const art = n.appearance && Object.keys(n.appearance).length ? window.renderPortrait(n.appearance, n.name || "") : n.svg;
      if (art) { const img = new Image(); img.alt = ""; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(art); row.append(img); }
      else { const d = document.createElement("div"); d.className = "ph"; row.append(d); }

      const body = document.createElement("div");
      const h = document.createElement("h2"); h.textContent = n.name || "(unnamed)";
      const sm = document.createElement("small"); sm.textContent = flat(n.title); h.append(sm);
      const meta = document.createElement("div"); meta.className = "muted";
      const pill = document.createElement("span"); pill.className = "pill" + (n.hidden ? " off" : ""); pill.textContent = n.hidden ? (n.flag ? "needs review" : "hidden") : "live";
      meta.append(pill, `by ${n.creator_name || "anonymous"} · ${new Date(n.created_at * 1000).toLocaleString()}`);
      if (n.flag) meta.append(` · ${flat(n.flag)}`);
      const det = document.createElement("details");
      const sum = document.createElement("summary"); sum.textContent = "Full scroll"; det.append(sum);
      [["Sect", n.sect], ["Found at", n.location], ["Signature move", n.art], ["Quirks", (n.traits || []).map(flat).join("; ")], ["Speech", n.speech], ["Goal", n.goal], ["Knowledge", n.knowledge], ["Greeting", n.greeting], ["Secret", n.secret]].forEach(([k, v]) => {
        if (!v) return; const p = document.createElement("p"); const b = document.createElement("b"); b.textContent = k + ": "; p.append(b, flat(v)); det.append(p);
      });
      body.append(h, meta, det);

      const act = document.createElement("div"); act.className = "actions";
      const vis = document.createElement("button"); vis.type = "button";
      vis.textContent = n.hidden ? (n.flag ? "Approve" : "Restore") : "Hide";
      vis.onclick = () => act_(() => call("POST", `/api/admin/npcs/${n.id}/visibility`, { hidden: !n.hidden, flag: n.hidden ? "" : "Hidden by admin" }));
      const del = document.createElement("button"); del.type = "button"; del.className = "danger";
      del.textContent = confirmDelete === n.id ? "Confirm delete" : "Delete";
      del.onclick = () => {
        if (confirmDelete !== n.id) { confirmDelete = n.id; render(); return; }
        confirmDelete = null; act_(() => call("DELETE", `/api/admin/npcs/${n.id}`));
      };
      act.append(vis, del);
      row.append(body, act);
      list.append(row);
    });
  }

  async function act_(fn) {
    try { await fn(); await load(); }
    catch (e) { $("#err").hidden = false; $("#err").textContent = e.message; }
  }

  $("#login").addEventListener("submit", e => {
    e.preventDefault(); pw = $("#pw").value;
    try { sessionStorage.setItem("jianghu-admin", pw); } catch {}
    load();
  });
  $("#signout").onclick = () => { pw = ""; try { sessionStorage.removeItem("jianghu-admin"); } catch {} load(); };
  $("#refresh").onclick = load;
  $("#seed").onclick = async () => {
    const b = $("#seed"); b.disabled = true; const label = b.textContent; b.textContent = "Rolling… (up to a minute)";
    try {
      const r = await call("POST", "/api/admin/seed", { count: 3 });
      $("#err").hidden = false; $("#err").style.color = "var(--jade)";
      $("#err").textContent = `Added ${r.created.length}: ${r.created.join(", ") || "none"}.` + (r.notes.length ? ` Skipped: ${r.notes.join("; ")}` : "");
      await load();
    } catch (e) { $("#err").hidden = false; $("#err").style.color = ""; $("#err").textContent = e.message; }
    finally { b.disabled = false; b.textContent = label; }
  };
  $("#filters").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f; confirmDelete = null;
    document.querySelectorAll("#filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  });
  $("#export").onclick = async () => {
    try {
      const data = await call("GET", "/api/admin/export");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
      a.download = `jianghu-npcs-${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch (e) { $("#err").hidden = false; $("#err").textContent = e.message; }
  };
  load();
})();
</script>
</body>
</html>
